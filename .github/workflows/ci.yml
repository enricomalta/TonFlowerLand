name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci || npm install
      - name: Run tests with coverage
        run: npm test -- --coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage
      - name: Fail if coverage below threshold (extra guard)
        run: |
          node -e "const fs=require('fs');const sum=f=>f.branches.pct>=70&&f.functions.pct>=70&&f.lines.pct>=70&&f.statements.pct>=70;const r=JSON.parse(fs.readFileSync('./coverage/coverage-summary.json'));if(!sum(r.total)){console.error('Coverage abaixo do threshold');process.exit(1)}"
